mode: deployment
replicaCount: 1

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: "0.156.0"
  pullPolicy: IfNotPresent

command:
  name: otelcol-contrib

presets:
  clusterMetrics:
    enabled: true
  kubernetesEvents:
    enabled: true
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: false
    extractAllPodAnnotations: false

extraEnvsFrom:
  - secretRef:
      name: otel-exporter-credentials
  - configMapRef:
      name: otel-exporter-config

ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  exporters:
    debug: null
    otlphttp/newrelic:
      endpoint: ${env:NEW_RELIC_OTLP_ENDPOINT}
      headers:
        api-key: ${env:NEW_RELIC_LICENSE_KEY}
      compression: gzip
      timeout: 10s
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s
      sending_queue:
        enabled: true
        num_consumers: 2
        queue_size: 1000
    otlphttp/grafana:
      endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
      auth:
        authenticator: basicauth/grafana
      compression: gzip
      timeout: 10s
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s
      sending_queue:
        enabled: true
        num_consumers: 2
        queue_size: 1000

  extensions:
    basicauth/grafana:
      client_auth:
        username: ${env:GRAFANA_CLOUD_INSTANCE_ID}
        password: ${env:GRAFANA_CLOUD_API_TOKEN}

  processors:
    batch:
      timeout: 5s
      send_batch_size: 1024
    resource/cluster:
      attributes:
        - key: k8s.cluster.name
          value: ${env:OTEL_CLUSTER_NAME}
          action: upsert
        - key: k8s.cluster.uid
          value: ${env:OTEL_CLUSTER_UID}
          action: upsert
        - key: deployment.environment.name
          value: ${env:OTEL_DEPLOYMENT_ENVIRONMENT}
          action: upsert

  receivers:
    jaeger: null
    zipkin: null

  service:
    extensions:
      - health_check
      - basicauth/grafana
    pipelines:
      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - k8s_attributes
          - resource/cluster
          - batch
        exporters:
          - otlphttp/newrelic
          - otlphttp/grafana
      metrics:
        receivers:
          - otlp
          - prometheus
        processors:
          - memory_limiter
          - k8s_attributes
          - resource/cluster
          - batch
        exporters:
          - otlphttp/newrelic
          - otlphttp/grafana
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - k8s_attributes
          - resource/cluster
          - batch
        exporters:
          - otlphttp/newrelic
          - otlphttp/grafana
