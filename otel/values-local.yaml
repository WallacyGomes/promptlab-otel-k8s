installation:
  namespace: observability
  collectorChart: open-telemetry/opentelemetry-collector
  collectorChartVersion: "0.165.0"
  operatorChart: open-telemetry/opentelemetry-operator
  operatorChartVersion: "0.120.0"
  agentRelease: otel-agent
  gatewayRelease: otel-gateway
  operatorRelease: otel-operator
  deploymentEnvironment: local

exporters:
  - newrelic
  - grafana

newRelic:
  region: US

grafana:
  otlpEndpoint: "SEU_ENDPOINT"
  instanceId: "SEU_ID"
