quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/prompt_lab}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:prompt_user}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:prompt_pass}
quarkus.datasource.jdbc.max-size=8
quarkus.log.category."com.promptlab".level=INFO
quarkus.log.console.format=%s%n
